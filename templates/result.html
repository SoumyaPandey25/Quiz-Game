<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
</head>
<body>
    <h2>
        {% if score == 10 %}
            🎉 Congratulations, You Won with a Perfect Score! 🎉
        {% else %}
            🏆 Quiz Complete! 🎊
        {% endif %}
    </h2>
    <p>Your Score: {{ score }} out of {{ total }}</p>
    <a href="{{ url_for('logout') }}">Log out</a>
</body>
</html>
